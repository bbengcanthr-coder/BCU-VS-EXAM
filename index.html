<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อสอบกลางภาค คณะสัตวแพทยศาสตร์ มหาวิทยาลัยเบงจันทร์</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary-color: #002147; /* สีกรมท่า มหาวิทยาลัยเบงจันทร์ */
            --bg-color: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .header h2 {
            margin: 5px 0 0;
            font-size: 1.1rem;
            font-weight: 400;
            color: #d1d5db;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary-color);
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: 'Sarabun', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Sarabun', sans-serif;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #00152e;
        }
        .subject-container {
            margin-top: 30px;
            border-top: 3px solid var(--primary-color);
            padding-top: 20px;
        }
        .subject-title {
            font-size: 1.3rem;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 15px;
        }
        .question-block {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f9fafb;
            border-radius: 6px;
            border: 1px solid #f3f4f6;
        }
        .question-text {
            font-weight: 600;
            margin-bottom: 10px;
        }
        .options label {
            display: block;
            font-weight: 400;
            color: var(--text-color);
            margin-bottom: 8px;
            cursor: pointer;
        }
        .options input {
            margin-right: 10px;
        }
        #resultArea {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
        }
        .grade-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .grade-table th, .grade-table td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: left;
        }
        .grade-table th {
            background-color: var(--primary-color);
            color: white;
        }
        .gpa-display {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-align: center;
            margin-top: 20px;
        }
        
        @media (max-width: 600px) {
            .header h1 { font-size: 1.2rem; }
            .container { padding: 15px; margin: 10px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>ข้อสอบกลางภาค คณะสัตวแพทยศาสตร์</h1>
        <h2>มหาวิทยาลัยเบงจันทร์ ปีการศึกษา 2569</h2>
    </div>

    <div class="container" id="loginArea">
        <div class="form-group">
            <label for="studentName">ชื่อ-นามสกุล นักศึกษาสัตวแพทย์</label>
            <input type="text" id="studentName" placeholder="กรอกชื่อและนามสกุล" required>
        </div>
        <div class="form-group">
            <label for="studyYear">เลือกชั้นปีที่กำลังศึกษา</label>
            <select id="studyYear">
                <option value="">-- กรุณาเลือกชั้นปี --</option>
                <option value="year1">ปี 1 เทอม 1</option>
                <option value="year2">ปี 2 เทอม 1</option>
                <option value="year3">ปี 3 เทอม 1</option>
                <option value="year4">ปี 4 ทั้งเทอม</option>
                <option value="year5">ปี 5 ทั้งเทอม</option>
                <option value="year6">ปี 6 (Externship)</option>
            </select>
        </div>
        <button onclick="startExam()">เริ่มทำข้อสอบ</button>
    </div>

    <div class="container" id="examArea" style="display: none;">
        <form id="examForm"></form>
        <button type="button" onclick="submitExam()" style="margin-top: 20px; background-color: #28a745;">ส่งข้อสอบและประมวลผลเกรด</button>
    </div>

    <div class="container" id="resultArea">
        <h2 style="text-align: center; color: var(--primary-color);">ใบรายงานผลการสอบ (Transcript)</h2>
        <p><strong>ชื่อนักศึกษา: </strong><span id="resName"></span></p>
        <p><strong>ชั้นปี: </strong><span id="resYear"></span></p>
        <table class="grade-table">
            <thead>
                <tr>
                    <th>รายวิชา</th>
                    <th>คะแนน (เต็ม 10)</th>
                    <th>เกรดที่ได้</th>
                </tr>
            </thead>
            <tbody id="gradeBody"></tbody>
        </table>
        <div class="gpa-display">GPA: <span id="finalGPA"></span></div>
    </div>

<script>
    // 1. ตั้งค่า Firebase (นำข้อมูลจากขั้นตอนที่ 1 มาใส่ตรงนี้)

const firebaseConfig = {
  apiKey: "AIzaSyCTjIf51PEaI5p7xxY4b9QQPZBD-NuPDoI",

    // 2. ฐานข้อมูลข้อสอบ (ตัวอย่างสำหรับปี 1 สมบูรณ์ 100%)
    const examData = {

                { q: "1. โครงสร้างใดที่พบในเซลล์พืชแต่ไม่พบในเซลล์สัตว์?", opts: ["เยื่อหุ้มเซลล์", "ผนังเซลล์และคลอโรพลาสต์", "ไมโทคอนเดรีย", "นิวเคลียส"], ans: 1 },

                { q: "3. ออร์แกเนลล์ใดทำหน้าที่เป็น 'โรงไฟฟ้า' ของเซลล์ในการสร้าง ATP?", opts: ["Ribosome", "Golgi body", "Mitochondria", "Lysosome"], ans: 2 },

                { q: "10. ข้อใดคือความสำคัญของความหลากหลายทางชีวภาพ?", opts: ["ทำให้เกิดมลพิษ", "รักษาสมดุลของระบบนิเวศ", "ลดจำนวนสิ่งมีชีวิต", "ไม่มีความสำคัญ"], ans: 1 }

                { q: "2. สุนัขที่ป่วยเป็นภาวะหัวใจซีกซ้ายล้มเหลว (Left-sided heart failure) มักแสดงอาการทางคลินิกใดเด่นชัดที่สุด?", opts: ["ท้องมาน (Ascites)", "ไอและมีภาวะน้ำท่วมปอด (Pulmonary edema)", "ดีซ่าน (Jaundice)", "ปัสสาวะเป็นเลือด"], ans: 1 },

                { q: "4. โรคเยื่อบุช่องท้องอักเสบติดต่อในแมว (FIP) มีสาเหตุจากการกลายพันธุ์ของเชื้อไวรัสชนิดใด?", opts: ["Feline Leukemia Virus", "Feline Immunodeficiency Virus", "Feline Coronavirus", "Feline Parvovirus"], ans: 2 },
                { q: "5. ลูกสุนัขมีอาการอาเจียน ท้องเสียเป็นเลือด มีกลิ่นเหม็นคาวจัด และผลเลือดพบเม็ดเลือดขาวต่ำมาก (Leukopenia) นึกถึงโรคใดเป็นอันดับแรก?", opts: ["Canine Distemper", "Canine Parvovirus infection", "Rabies", "Leptospirosis"], ans: 1 },
                { q: "6. การวินิจฉัยยืนยันโรคเบาหวานในสุนัข ต้องตรวจพบความผิดปกติในข้อใดร่วมกัน?", opts: ["น้ำตาลในเลือดต่ำและน้ำตาลในปัสสาวะ", "น้ำตาลในเลือดสูงอย่างต่อเนื่องและมีน้ำตาลในปัสสาวะ", "คีโตนในเลือดสูงอย่างเดียว", "โปรตีนรั่วในปัสสาวะ"], ans: 1 },
                { q: "7. สุนัขที่มีอาการไอแห้งๆ เสียงดังคล้ายห่านร้อง (Honking cough) มักสัมพันธ์กับความผิดปกติใด?", opts: ["หลอดลมตีบแคบ (Tracheal collapse)", "กระเพาะอาหารบิดตัว (GDV)", "พยาธิเม็ดเลือด", "ปอดอักเสบจากเชื้อรา"], ans: 0 },
                { q: "8. ภาวะ Hypoadrenocorticism ในสุนัข มีชื่อเรียกอีกอย่างหนึ่งว่าอะไร?", opts: ["Cushing's disease", "Addison's disease", "Grave's disease", "Hashimoto's disease"], ans: 1 },
                { q: "9. แมวอายุมากที่มีอาการกินเก่งแต่น้ำหนักลด กระวนกระวาย ควรส่งตรวจค่าทางห้องปฏิบัติการใดเพื่อการวินิจฉัยเบื้องต้น?", opts: ["Total T4", "Insulin", "Cortisol", "BUN/Creatinine อย่างเดียว"], ans: 0 },
                { q: "10. ข้อใดคืออาการทางคลินิกที่พบบ่อยของโรคไตเรื้อรัง (CKD) ในระยะท้าย?", opts: ["น้ำหนักตัวเพิ่มขึ้น", "ภาวะยูรีเมีย (Uremia) อาเจียน และมีแผลในปาก", "หัวใจเต้นช้าผิดปกติ", "ขนร่วงเป็นหย่อมๆ"], ans: 1 }

            "ศัลยศาสตร์และวิสัญญีวิทยาพื้นฐาน": [

                { q: "3. วัสดุเย็บแผล (Suture material) ในข้อใดจัดเป็นชนิด 'ละลายได้' (Absorbable)?", opts: ["Silk", "Nylon (Ethilon)", "Polyglactin 910 (Vicryl)", "Polypropylene (Prolene)"], ans: 2 },
                { q: "4. การใช้ยาระงับความรู้สึกนำ (Preanesthetic medication) กลุ่ม Opioids มีจุดประสงค์หลักเพื่ออะไร?", opts: ["ลดกรดในกระเพาะ", "ให้ฤทธิ์ระงับปวด (Analgesia)", "ทำให้กล้ามเนื้อคลายตัว 100%", "กระตุ้นการหายใจ"], ans: 1 },
                { q: "5. ผลข้างเคียงที่พบบ่อยที่สุดขณะฉีดยา Propofol เพื่อชักนำการสลบ (Induction) คืออะไร?", opts: ["หัวใจเต้นเร็วมาก", "ภาวะหยุดหายใจชั่วขณะ (Apnea)", "ชักเกร็ง", "อาเจียนรุนแรง"], ans: 1 },

                { q: "7. ระยะแรกสุดของกระบวนการหายของแผล (Wound healing) คือระยะใด?", opts: ["Proliferative phase", "Remodeling phase", "Inflammatory phase", "Maturation phase"], ans: 2 },
                { q: "8. การเตรียมตัวสัตว์ก่อนผ่าตัดแบบวางแผนล่วงหน้า (Elective surgery) ควรงดน้ำงดอาหารอย่างน้อยกี่ชั่วโมงในสุนัขและแมวโต?", opts: ["งดน้ำและอาหาร 1-2 ชั่วโมง", "งดอาหาร 8-12 ชั่วโมง และงดน้ำ 2-4 ชั่วโมง", "งดอาหาร 24 ชั่วโมง", "ไม่ต้องงด"], ans: 1 },
                { q: "9. ยาสลบชนิดดม (Inhalant anesthetic) ที่นิยมใช้ในคลินิกสัตวแพทย์ปัจจุบันคือข้อใด?", opts: ["Isoflurane", "Ether", "Chloroform", "Nitrous oxide เดี่ยวๆ"], ans: 0 },

            "รังสีวิทยาและการวินิจฉัยด้วยภาพ": [

                { q: "10. ข้อห้ามสำคัญในการทำ MRI (Magnetic Resonance Imaging) คือสิ่งใด?", opts: ["ห้ามนำวัตถุที่เป็นโลหะแม่เหล็กเข้าห้องตรวจ", "ห้ามให้สัตว์กินอาหาร 3 วัน", "ห้ามใช้ในสัตว์อายุน้อยกว่า 1 ปี", "ห้ามใช้ในสัตว์ที่มีกระดูกหัก"], ans: 0 }

            "สูติศาสตร์และเธริโอเจนวิทยา": [
                { q: "1. ในวงรอบการเป็นสัดของสุนัข ระยะใดที่สุนัขตัวเมียจะยอมรับการผสมพันธุ์จากตัวผู้?", opts: ["Proestrus", "Estrus", "Diestrus", "Anestrus"], ans: 1 },
                { q: "2. ฮอร์โมนใดที่มีหน้าที่สำคัญในการรักษาสภาพการตั้งท้อง (Maintain pregnancy)?", opts: ["Estrogen", "Progesterone", "Luteinizing Hormone (LH)", "Prolactin"], ans: 1 },
                { q: "3. ระยะเวลาการตั้งท้อง (Gestation period) ปกติของสุนัขและแมวอยู่ที่ประมาณกี่วัน?", opts: ["45 วัน", "63 วัน (หรือประมาณ 2 เดือน)", "90 วัน", "120 วัน"], ans: 1 },

                { q: "5. ภาวะคลอดลำบาก (Dystocia) ในสุนัข อาจมีสาเหตุมาจากอะไรได้บ้าง?", opts: ["มดลูกไม่มีแรงบีบตัว (Uterine inertia)", "ลูกสัตว์มีขนาดใหญ่เกินไป", "เชิงกรานแม่แคบ", "ถูกทุกข้อ"], ans: 3 },

                { q: "9. ภาวะที่อัณฑะไม่เคลื่อนลงมาอยู่ในถุงอัณฑะ (Retained testicle) เรียกว่าอะไร?", opts: ["Phimosis", "Paraphimosis", "Cryptorchidism", "Orchitis"], ans: 2 },

            "การจัดการสุขภาพฝูงสัตว์": [
                { q: "1. เป้าหมายสูงสุดของการจัดการสุขภาพฝูงสัตว์ (Herd Health Management) คืออะไร?", opts: ["การรักษาสัตว์รายตัวให้หายป่วย", "การป้องกันโรคและเพิ่มประสิทธิภาพผลผลิตของฝูงสัตว์", "การลดจำนวนสัตว์ในฟาร์ม", "การขายยารักษาสัตว์ให้มากที่สุด"], ans: 1 },
                { q: "2. หลักการความปลอดภัยทางชีวภาพ (Biosecurity) ข้อใดช่วยป้องกันการนำเชื้อโรคใหม่เข้าสู่ฟาร์มได้ดีที่สุด?", opts: ["การกักกันสัตว์ใหม่ (Quarantine) ก่อนนำเข้ารวมฝูง", "การเพิ่มปริมาณอาหาร", "การอาบน้ำให้สัตว์ทุกวัน", "การให้ยาปฏิชีวนะรวมในอาหารตลอดเวลา"], ans: 0 },
                { q: "3. สาเหตุหลักของโรคเต้านมอักเสบ (Mastitis) ในโคนมคืออะไร?", opts: ["การติดเชื้อแบคทีเรีย", "การขาดแคลเซียม", "กรรมพันธุ์", "การรีดนมช้า"], ans: 0 },

                { q: "5. ระบบการเลี้ยงแบบ 'All-in, All-out' นิยมใช้ในฟาร์มสัตว์ชนิดใดเพื่อตัดวงจรโรค?", opts: ["โคนมและม้า", "สุกรและสัตว์ปีก", "สุนัขและแมว", "ช้างและสุกร"], ans: 1 },

    let currentYearStr = "";
    
    function startExam() {
        const name = document.getElementById('studentName').value;
        const year = document.getElementById('studyYear').value;

        if (!name || !year) {
            alert("กรุณากรอกชื่อและเลือกชั้นปีให้ครบถ้วน");
            return;
        }

        currentYearStr = document.getElementById('studyYear').options[document.getElementById('studyYear').selectedIndex].text;
        
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('examArea').style.display = 'block';

        renderQuestions(year);
    }

    function renderQuestions(yearKey) {
        const examForm = document.getElementById('examForm');
        examForm.innerHTML = ''; 

        // ตรวจสอบว่ามีข้อมูลปีนี้หรือไม่ (ตัวอย่างนี้มี year1 สมบูรณ์)
        const subjects = examData[yearKey];
        
        if (!subjects) {
            examForm.innerHTML = `<h3 style="color:red; text-align:center;">กำลังปรับปรุงฐานข้อมูลข้อสอบสำหรับชั้นปีนี้... กรุณาทดสอบด้วย "ปี 1 เทอม 1"</h3>`;
            return;
        }

        for (const [subjectName, questions] of Object.entries(subjects)) {
            const subjectDiv = document.createElement('div');
            subjectDiv.className = 'subject-container';
            
            const title = document.createElement('div');
            title.className = 'subject-title';
            title.innerText = `วิชา: ${subjectName}`;
            subjectDiv.appendChild(title);

            questions.forEach((item, index) => {
                const qBlock = document.createElement('div');
                qBlock.className = 'question-block';
                
                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerText = item.q;
                qBlock.appendChild(qText);

                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';

                item.opts.forEach((opt, optIndex) => {
                    const label = document.createElement('label');
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    // บังคับทำทุกข้อ
                    radio.required = true;
                    radio.name = `ans_${subjectName}_${index}`;
                    radio.value = optIndex;

                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(opt));
                    optionsDiv.appendChild(label);
                });

                qBlock.appendChild(optionsDiv);
                subjectDiv.appendChild(qBlock);
            });

            examForm.appendChild(subjectDiv);
        }
    }

    function calculateGrade(score) {
        if (score >= 9) return { letter: 'A', point: 4.0 };
        if (score >= 8) return { letter: 'B+', point: 3.5 };
        if (score >= 7) return { letter: 'B', point: 3.0 };
        if (score >= 6) return { letter: 'C+', point: 2.5 };
        if (score >= 5) return { letter: 'C', point: 2.0 };
        if (score >= 4) return { letter: 'D+', point: 1.5 };
        if (score >= 3) return { letter: 'D', point: 1.0 };
        return { letter: 'F', point: 0.0 };
    }

    function submitExam() {
        const examForm = document.getElementById('examForm');
        if (!examForm.checkValidity()) {
            alert("กรุณาทำข้อสอบให้ครบทุกข้อ (ห้ามขาด) ระบบถึงจะประมวลผลได้");
            return;
        }

        const name = document.getElementById('studentName').value;
        const yearKey = document.getElementById('studyYear').value;
        const subjects = examData[yearKey];

        if (!subjects) return;

        let totalPoints = 0;
        let subjectCount = 0;
        let resultsForDB = {};

        const tbody = document.getElementById('gradeBody');
        tbody.innerHTML = '';

        for (const [subjectName, questions] of Object.entries(subjects)) {
            let score = 0;
            questions.forEach((item, index) => {
                const selected = document.querySelector(`input[name="ans_${subjectName}_${index}"]:checked`);
                if (selected && parseInt(selected.value) === item.ans) {
                    score++;
                }
            });

            const grade = calculateGrade(score);
            totalPoints += grade.point;
            subjectCount++;

            resultsForDB[subjectName] = { score: score, grade: grade.letter };

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${subjectName}</td>
                <td>${score} / 10</td>
                <td><strong>${grade.letter}</strong></td>
            `;
            tbody.appendChild(tr);
        }

        const gpa = (totalPoints / subjectCount).toFixed(2);
        
        document.getElementById('resName').innerText = name;
        document.getElementById('resYear').innerText = currentYearStr;
        document.getElementById('finalGPA').innerText = gpa;

        document.getElementById('examArea').style.display = 'none';
        document.getElementById('resultArea').style.display = 'block';

        // บันทึกลง Firebase Firestore
        db.collection("examResults").add({
            studentName: name,
            academicYear: "2569",
            studyYear: currentYearStr,
            gpa: gpa,
            details: resultsForDB,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            console.log("บันทึกข้อมูลนักศึกษาลงฐานข้อมูลสำเร็จ!");
        }).catch((error) => {
            console.error("เกิดข้อผิดพลาดในการบันทึกข้อมูล: ", error);
        });
    }
</script>
